services:
  # image-service: Python background removal service (optional)
  # This is the only service needed for local development.
  # Database and auth are handled by Convex (cloud).
  image-service:
    build:
      context: ./image-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2001:db8:1::/64
