services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kyarafit
      POSTGRES_USER: kyarafit
      POSTGRES_PASSWORD: kyarafit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyarafit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://kyarafit:kyarafit@postgres:5432/kyarafit?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  image-service:
    build:
      context: ./image-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

volumes:
  postgres_data:
