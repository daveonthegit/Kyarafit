services:
  # Local postgres disabled - using Supabase instead
  # Uncomment below if you want to use local postgres for development
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: kyarafit
  #     POSTGRES_USER: kyarafit
  #     POSTGRES_PASSWORD: kyarafit
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U kyarafit"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      # Database - loaded from .env file (required)
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATIONS_PATH=/root/migrations
      # Supabase configuration - loaded from .env file (required)
      - SUPABASE_URL=${SUPABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Image service
      - IMAGE_SERVICE_URL=http://image-service:8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  image-service:
    build:
      context: ./image-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2001:db8:1::/64

volumes:
  postgres_data:
