linters-settings:
  govet:
    enable:
      - shadow
  misspell:
    locale: US
  gosec:
    excludes:
      - G402 # TLS MinVersion check (we explicitly set it)

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gosec        # Security issues
    - goimports    # Import formatting
    - misspell     # Spelling
    # Temporarily disabled (noisy, non-critical):
    # - dupl       # Code duplication (refactor later)
    # - gocyclo    # Complexity (business logic)
    # - gocritic   # Style opinions (too strict)
    # - goconst    # String constants (minor)
    # - bodyclose, unconvert, whitespace, gofmt (covered by goimports)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    - path: migrations/
      linters:
        - gosec
    # Allow some shadowing in tests
    - path: _test\.go
      text: "shadow:"
    # Ignore commented code warnings in main (often config examples)
    - path: main\.go
      text: "commentedOutCode:"

run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - vendor
    - node_modules
  exclude-files:
    - ".*\\.pb\\.go$"

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
