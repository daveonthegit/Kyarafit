<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kyarafit | High-Fashion Lookbook</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --stark-white: #ffffff;
            --editorial-black: #000000;
            --muted-gray: #757575;
        }
        body {
            background-color: var(--stark-white);
            font-family: 'Montserrat', sans-serif;
            color: var(--editorial-black);
            overflow-x: hidden;
        }
        .font-serif-elegant { 
            font-family: 'Bodoni Moda', serif; 
            letter-spacing: -0.02em;
        }
        .font-sans-wide { 
            font-family: 'Montserrat', sans-serif; 
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
        }
        .border-thin {
            border: 0.5px solid var(--editorial-black);
        }
        .line-decorative {
            height: 1px;
            background-color: var(--editorial-black);
            width: 40px;
        }
    </style>
<style>
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased">
<div class="relative flex flex-col min-h-screen">
<header class="flex justify-between items-center px-8 pt-10 z-20">
<span class="font-serif-elegant text-2xl font-bold italic tracking-tighter">Kyarafit</span>
<button class="font-sans-wide text-[10px] text-zinc-400">Skip</button>
</header>
<main class="flex-1 flex flex-col pt-8">
<div class="px-0 mb-10">
<div class="image-container relative">
<img alt="High-fashion Editorial" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5j_rjik1qfSqmE54IvlQ-f93B0ic1cMxmr4b5UdTCH9jUwmMLGKWBb0I7q-2GTYocwgz4-cw76dbs2rVBlitZa9YCGAX42unGgJ4-1jMOxB1Jo5GIdpLCDYuIsOMiUNzgwVQk9HHCG2sH1_T97gvqe9a4z7nemuaxofVVC2yPD4NuamYwLJ89xyERKi8ayBVi-4-jlq2_ReZz-IvBQOKL8fEEYSuYKZtNSCV4qtxrDAEyEDwBPkVFNygFQEiVGt9BjSqc3ui-kxcK"/>
<div class="absolute bottom-6 right-8 text-[10px] font-sans-wide text-white mix-blend-difference">
                        Issue 01 / Vol 24
                    </div>
</div>
</div>
<div class="px-8 space-y-6 flex flex-col">
<div class="space-y-1">
<p class="font-sans-wide text-[9px] text-zinc-500 mb-2">The Art of Transformation</p>
<h1 class="font-serif-elegant text-5xl leading-[1.1] font-normal">
                        Elevated <br/>
<span class="italic">Cosplay</span>
</h1>
</div>
<div class="flex items-center gap-4">
<div class="line-decorative"></div>
<p class="font-sans-wide text-[10px] leading-loose text-zinc-600 max-w-[200px]">
                        A curated digital space for the modern artisan.
                    </p>
</div>
</div>
</main>
<footer class="px-8 pb-12 mt-10">
<div class="flex flex-col gap-6">
<button class="border-thin py-4 w-full font-sans-wide text-xs hover:bg-black hover:text-white transition-all duration-300">
                    Get Started
                </button>
<div class="flex justify-between items-center">
<div class="flex gap-2">
<div class="w-8 h-[1px] bg-black"></div>
<div class="w-2 h-[1px] bg-zinc-200"></div>
<div class="w-2 h-[1px] bg-zinc-200"></div>
</div>
<button class="font-sans-wide text-[9px] text-black border-b border-black pb-0.5">
                        Log In
                    </button>
</div>
</div>
</footer>
</div>
<div class="fixed top-1/2 -right-16 -translate-y-1/2 rotate-90 pointer-events-none opacity-[0.03] select-none">
<span class="font-serif-elegant text-[12rem] whitespace-nowrap">LOOKBOOK</span>
</div>

</body></html>
