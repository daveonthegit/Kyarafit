version: 2
updates:
  # All npm workspaces share the root lockfile; update them in one lane.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      auth-integration:
        patterns:
          - "better-auth"
          - "@convex-dev/better-auth"
          - "convex"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
