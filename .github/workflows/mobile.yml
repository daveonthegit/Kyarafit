name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "scripts/i18n/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "scripts/i18n/**"
      - ".github/workflows/mobile.yml"
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Locale key parity (en / ja / es)
        run: node scripts/i18n/check-keys.mjs

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Run ESLint
        working-directory: ./mobile
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint || echo "Lint has warnings, continuing..."
          else
            echo "No lint script found, skipping"
          fi
        continue-on-error: true

      - name: Run TypeScript check
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Enforce EXPO_PUBLIC_ env usage in mobile/src
        working-directory: ./mobile
        run: node scripts/check-expo-public-env.js

      - name: Run Prettier check
        working-directory: ./mobile
        run: |
          npx prettier --check "**/*.{js,jsx,ts,tsx,json,md}"

      - name: Run tests (if available)
        working-directory: ./mobile
        run: |
          if [ -f "package.json" ] && npm run test --if-present; then
            npm run test
          else
            echo "No tests configured yet"
          fi

  eas-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Configure EAS
        working-directory: ./mobile
        run: |
          # Create basic EAS configuration if it doesn't exist
          if [ ! -f "eas.json" ]; then
            cat > eas.json << 'EOF'
          {
            "cli": {
              "version": ">= 3.0.0"
            },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              },
              "preview": {
                "distribution": "internal"
              },
              "production": {}
            },
            "submit": {
              "production": {}
            }
          }
          EOF
          fi

      - name: EAS Build (Android)
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas build --platform android --non-interactive --no-wait
          else
            echo "EXPO_TOKEN not set, skipping EAS build"
          fi

      - name: EAS Build (iOS)
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas build --platform ios --non-interactive --no-wait
          else
            echo "EXPO_TOKEN not set, skipping EAS build"
          fi

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Run npm audit
        working-directory: ./mobile
        run: |
          npm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=mobile/package.json
        continue-on-error: true

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Check code formatting
        working-directory: ./mobile
        run: |
          if ! npx prettier --check "**/*.{js,jsx,ts,tsx,json,md}" --ignore-path .gitignore; then
            echo "❌ Code formatting issues found!"
            echo ""
            echo "To fix locally, run:"
            echo "  cd mobile && npm run format"
            echo ""
            echo "Or from root:"
            echo "  npm run format"
            exit 1
          else
            echo "✅ Code is properly formatted"
          fi
