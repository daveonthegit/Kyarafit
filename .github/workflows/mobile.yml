name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "design-system/**"
      - "scripts/i18n/**"
      - "package.json"
      - "package-lock.json"
      - "convex/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "design-system/**"
      - "scripts/i18n/**"
      - "package.json"
      - "package-lock.json"
      - "convex/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Lint, types, i18n, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Locale key parity (en / ja / es)
        run: npm run i18n:check

      - name: ESLint (mobile)
        run: npm run lint -w mobile

      - name: TypeScript (mobile)
        run: npm run typecheck -w mobile

      - name: Expo public env guard
        run: npm run check:env -w mobile

      - name: Prettier check (mobile)
        run: npm run format:check -w mobile

      - name: Tests (mobile)
        run: npm run test -w mobile

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: npm audit (mobile)
        working-directory: mobile
        run: npm audit --audit-level moderate

      - name: Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=mobile/package.json
        continue-on-error: true

  eas-build:
    name: EAS build (optional)
    runs-on: ubuntu-latest
    needs: mobile
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Configure EAS
        working-directory: mobile
        run: |
          if [ ! -f "eas.json" ]; then
            cat > eas.json << 'EOF'
          {
            "cli": {
              "version": ">= 3.0.0"
            },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              },
              "preview": {
                "distribution": "internal"
              },
              "production": {}
            },
            "submit": {
              "production": {}
            }
          }
          EOF
          fi

      - name: EAS Build (Android)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas build --platform android --non-interactive --no-wait
          else
            echo "EXPO_TOKEN not set, skipping EAS build"
          fi

      - name: EAS Build (iOS)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas build --platform ios --non-interactive --no-wait
          else
            echo "EXPO_TOKEN not set, skipping EAS build"
          fi
