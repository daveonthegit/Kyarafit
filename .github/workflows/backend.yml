name: Backend CI

# The Go backend has been archived (backend-archived/).
# The application now uses Convex as the backend.
# This workflow is disabled — it's kept for historical reference only.

on:
  workflow_dispatch: # Only run manually if needed

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Skip — backend archived
        run: |
          echo "## ⚠️ Backend CI Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Go Fiber backend has been archived. The app now uses **Convex** as its backend." >> $GITHUB_STEP_SUMMARY
          echo "See \`backend-archived/\` for the archived code." >> $GITHUB_STEP_SUMMARY
