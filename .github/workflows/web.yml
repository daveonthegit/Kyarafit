name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - "convex/**"
      - "design-system/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "web/**"
      - "convex/**"
      - "design-system/**"
      - ".github/workflows/web.yml"
  workflow_call:

jobs:
  test:
    name: Web CI (lint, typecheck, test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm install

      - name: Install web dependencies
        working-directory: ./web
        run: npm install

      - name: Run ESLint
        working-directory: ./web
        run: npm run lint

      - name: Run TypeScript check
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Run Convex TypeScript check
        run: npx tsc -p convex/tsconfig.json --noEmit

      - name: Run tests
        working-directory: ./web
        run: npm run test
