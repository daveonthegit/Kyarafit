name: Web E2E (manual)

# Playwright web E2E is a LIVE-ENV gate: it drives a real app against a Convex dev deployment and a
# seeded account. It is intentionally MANUAL-ONLY (workflow_dispatch) so it never runs on push/PR and
# cannot block the default web gate. It no-ops unless the required secrets are configured.
#
# Required repo secrets: E2E_CONVEX_URL, E2E_USER_EMAIL, E2E_USER_PASSWORD.
# See docs/TESTING.md §9.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (web)
    runs-on: ubuntu-latest
    # Skip cleanly when secrets are absent — avoids a red run on a repo without E2E creds.
    if: ${{ vars.E2E_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm install

      - name: Install web dependencies
        working-directory: ./web
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: ./web
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
          E2E_WEBSERVER: "1"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
