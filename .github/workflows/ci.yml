name: Main CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # Web application (lint, typecheck, test only; Vercel handles build/deploy)
  web:
    name: Web Frontend CI
    uses: ./.github/workflows/web.yml
    secrets: inherit

  # Mobile application
  mobile:
    name: Mobile App CI
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: npm audit (root)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Security summary
        if: always()
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scanning completed (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vulnerability scanning completed (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency audit completed (npm audit)" >> $GITHUB_STEP_SUMMARY

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [web, mobile]
    if: always()

    steps:
      - name: Create Build Summary
        run: |
          echo "## 🚀 CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web Frontend | ${{ needs.web.result == 'success' && '✅ Passed' || '❌ Failed' }} | Lint, typecheck, test (Vercel for deploy) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile App | ${{ needs.mobile.result == 'success' && '✅ Passed' || '❌ Failed' }} | React Native + Convex |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Web: Vercel preview builds. Backend: **Convex**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.web.result }}" == "success" && "${{ needs.mobile.result }}" == "success" ]]; then
            echo "### ✅ Overall Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI checks passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Overall Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
