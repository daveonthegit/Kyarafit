name: Main CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # Web application
  web:
    name: Web Frontend CI
    uses: ./.github/workflows/web.yml
    secrets: inherit

  # Image processing service
  image-service:
    name: Image Service CI
    uses: ./.github/workflows/image-service.yml
    secrets: inherit

  # Mobile application
  mobile:
    name: Mobile App CI
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  # Integration smoke test — only image-service (backend replaced by Convex)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [web, image-service, mobile]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install image service dependencies
        run: |
          cd image-service && pip install -r requirements.txt

      - name: Start image service
        run: |
          cd image-service
          PORT=8000 python main.py &

          echo "Waiting for image service..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Image service ready"
              break
            fi
            sleep 1
          done

      - name: Run integration smoke tests
        run: |
          echo "## 🧪 Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "Testing image service..."
          if curl -f http://localhost:8000/health; then
            echo "- ✅ Image service health check" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Image service health check failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All integration smoke tests passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Backend is now Convex (cloud). No self-hosted backend to test." >> $GITHUB_STEP_SUMMARY

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: npm audit (root)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Security summary
        if: always()
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scanning completed (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vulnerability scanning completed (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency audit completed (npm audit)" >> $GITHUB_STEP_SUMMARY

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [web, image-service, mobile]
    if: always()

    steps:
      - name: Create Build Summary
        run: |
          echo "## 🚀 CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web Frontend | ${{ needs.web.result == 'success' && '✅ Passed' || '❌ Failed' }} | Next.js + Convex |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖼️ Image Service | ${{ needs.image-service.result == 'success' && '✅ Passed' || '❌ Failed' }} | Python/rembg |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile App | ${{ needs.mobile.result == 'success' && '✅ Passed' || '❌ Failed' }} | React Native + Convex |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Backend is **Convex** (cloud-hosted). No Go backend CI needed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.web.result }}" == "success" && "${{ needs.image-service.result }}" == "success" && "${{ needs.mobile.result }}" == "success" ]]; then
            echo "### ✅ Overall Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All services passed CI checks and are ready for deployment!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Overall Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some services failed CI checks. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
