name: Deploy Web to GCP Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'design-system/**'
      - '.github/workflows/deploy-gcp-web.yml'
  workflow_dispatch:

env:
  PROJECT_ID: kyarafit
  REGION: us-central1
  SERVICE_NAME: kyarafit-web

# Prevent concurrent deployments
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Wait for CI to pass before deploying
  check-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Wait for CI checks
      uses: lewagon/wait-on-check-action@v1.3.1
      with:
        ref: ${{ github.sha }}
        check-name: 'Web Frontend CI'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 10
        allowed-conclusions: success

  deploy:
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: https://www.kyarafit.com
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build \
          -f web/Dockerfile \
          --build-arg NEXT_PUBLIC_APP_URL=https://www.kyarafit.com \
          --build-arg NEXT_PUBLIC_API_URL=https://api.kyarafit.com \
          --build-arg NEXT_PUBLIC_IMAGE_SERVICE_URL=https://images.kyarafit.com \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/kyarafit/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/kyarafit/${{ env.SERVICE_NAME }}:latest \
          .

    - name: Push to Artifact Registry
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/kyarafit/${{ env.SERVICE_NAME }}:${{ github.sha }}
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/kyarafit/${{ env.SERVICE_NAME }}:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/kyarafit/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --set-env-vars "NEXT_PUBLIC_APP_URL=https://www.kyarafit.com" \
          --set-env-vars "NEXT_PUBLIC_API_URL=https://api.kyarafit.com" \
          --set-env-vars "NEXT_PUBLIC_IMAGE_SERVICE_URL=https://images.kyarafit.com" \
          --set-env-vars "BETTER_AUTH_URL=https://www.kyarafit.com" \
          --set-env-vars "NODE_ENV=production" \
          --set-secrets="BETTER_AUTH_SECRET=auth-secret:latest" \
          --set-secrets="DATABASE_URL=database-url:latest" \
          --memory 512Mi \
          --cpu 1 \
          --max-instances 10 \
          --min-instances 0 \
          --timeout 60s \
          --concurrency 80

    - name: Get Service URL
      id: url
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region ${{ env.REGION }} \
          --format 'value(status.url)')
        echo "Service deployed to: $SERVICE_URL"
        echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

    - name: Smoke test deployed service
      run: |
        echo "Testing deployed service..."
        sleep 15  # Wait for service to stabilize
        if curl -f -I "${{ steps.url.outputs.url }}"; then
          echo "✅ Smoke test passed"
        else
          echo "❌ Smoke test failed"
          exit 1
        fi

    - name: Create deployment summary
      if: always()
      run: |
        echo "## ✅ Web Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Service:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL:** ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Custom Domain:** https://www.kyarafit.com" >> $GITHUB_STEP_SUMMARY
        echo "- **Image:** ${{ env.SERVICE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔄 Rollback" >> $GITHUB_STEP_SUMMARY
        echo "If needed, rollback with:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "gcloud run services update-traffic ${{ env.SERVICE_NAME }} --to-revisions=PREVIOUS=100 --region ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
